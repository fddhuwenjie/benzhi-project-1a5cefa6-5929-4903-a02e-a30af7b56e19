<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>排烟联动演练资格工作台</title><link rel="stylesheet" href="/assets/app.css"><link rel="stylesheet" href="/assets/enhancements.css"></head>
<body>
<header class="top"><div><span class="brand-mark">联</span><strong>排烟联动演练资格工作台</strong></div><form id="open-form" class="case-open"><input id="open-id" aria-label="案件编号" placeholder="输入案件编号"><button>打开案件</button></form></header>
<main>
  <section class="status-band"><div><small>当前案件</small><h1 id="case-title">新建演练案件</h1></div><ol id="status-strip" aria-label="案件状态"></ol><div class="revision">REV <b id="revision">0</b></div></section>
  <div id="notice" role="status" aria-live="polite"></div>
  <section class="workspace">
    <nav class="tabs" aria-label="工作区"><button data-tab="protocol" class="active">方案</button><button data-tab="timeline">时间轴</button><button data-tab="rules">规则结果</button><button data-tab="deviations">偏差整改</button><button data-tab="review">复核与证书</button></nav>
    <article id="protocol" class="panel active"><div class="section-head"><div><h2>案件与冻结方案</h2><p>建筑分区、设备角色与时限基线</p></div><span id="protocol-badge" class="badge">未冻结</span></div>
      <form id="create-form" class="form-grid"><label>案件编号<input name="case_id" required value="CASE-2026-001"></label><label>建筑名称<input name="building_name" required value="研发中心 A 座"></label><label>建档人员<input name="created_by" required value="recorder-01"></label><button class="primary">建立案件</button></form>
      <form id="freeze-form" class="hidden"><div class="form-grid"><label>冻结人员<input name="frozen_by" required value="safety-lead-01"></label><label>建筑分区<input name="zones" value="东区,核心区" required></label><label>参与人员<input name="participants" value="recorder-01,operator-01" required></label></div><div class="table-wrap"><table><thead><tr><th>设备 ID</th><th>分区</th><th>角色</th></tr></thead><tbody id="device-editor"></tbody></table></div><div class="table-wrap"><table><thead><tr><th>规则</th><th>名称</th><th>起点角色</th><th>终点角色</th><th>最大响应 ms</th><th>证据</th></tr></thead><tbody id="rule-editor"></tbody></table></div><div class="action-row"><button type="button" id="precheck-btn">预检方案</button><button class="primary" id="freeze-btn" disabled>冻结方案并开始采集</button></div><div id="precheck-view" class="diagnostic"></div></form>
      <div id="protocol-view"></div>
    </article>
    <article id="timeline" class="panel"><div class="section-head"><div><h2>毫秒级事件时间轴</h2><p id="run-label">初次演练事件</p></div><button type="button" id="add-event" class="icon" title="添加事件">＋</button></div><form id="run-form"><div class="form-grid"><label>轮次 ID<input name="run_id" required></label><label>记录人员<input name="recorded_by" value="recorder-01" required></label><label>轮次类型<select name="run_kind"><option value="initial">初次演练</option><option value="targeted">定向复演</option></select></label><label>目标规则<input name="target_rules" placeholder="定向复演时填写"></label></div><div id="event-editor" class="event-list"></div><button class="primary">提交轮次并评估</button></form><div id="timeline-view"></div></article>
    <article id="rules" class="panel"><div class="section-head"><div><h2>确定性规则矩阵</h2><p>按冻结方案计算证据窗口与响应耗时</p></div><span id="result-summary" class="badge">尚未评估</span></div><div class="filter-row"><label>失败类型<select id="failure-filter"><option value="">全部结果</option><option value="start_missing">起点缺失</option><option value="end_missing">终点缺失</option><option value="end_before_start">顺序倒置</option><option value="response_timeout">响应超时</option><option value="required_evidence_missing">证据缺失</option></select></label><label class="check-label"><input type="checkbox" id="critical-filter">仅看临界合格</label></div><div id="rules-view"></div></article>
    <article id="deviations" class="panel"><div class="section-head"><div><h2>偏差与纠正措施</h2><p>失败规则逐项闭环并限定复演范围</p></div></div><form id="correction-form"><div id="deviation-editor"></div><button class="primary">登记偏差并进入定向复演</button></form><div id="deviation-view"></div></article>
    <article id="review" class="panel"><div class="review-grid"><section><h2>独立复核</h2><form id="review-form"><label>复核员<input name="reviewer_id" value="reviewer-01" required></label><div id="readiness-view" class="diagnostic"></div><label>结论<select name="decision"><option value="approved">批准</option><option value="rejected">拒绝</option></select></label><label>复核理由<textarea name="reason" rows="3"></textarea></label><button class="primary">封存复核结论</button></form></section><section><h2>证书校验</h2><div id="certificate-view" class="certificate-empty">尚无资格证书</div><button id="verify-btn" type="button">逐项校验证书与审计链</button><div id="verify-view"></div></section></div></article>
  </section>
</main><script src="/assets/app.js" defer></script></body></html>
